# CV-proj-2026 Rock5B live configuration
# Format: key=value. Boolean true values become flags; false values are skipped.

backend=aravis
source=Hikrobot-2bdfB0178676-DB0178676
width=1440
height=1080
fps=60
exposure-us=10000
gain-db=8
pixel-format=BayerRG8
swap-rb=true

grid-points=128
motion-thresh=2.0
downsample-width=640
downsample-height=480

denoise=bilateral
denoise-kernel=7
denoise-sigma-color=75
denoise-sigma-space=11
denoise-passes=2
target-luma=82
max-post-gain=2.0
gamma=1.0
clahe-clip=1.0

detector=yolo
model=src/yolo11n.onnx
detect-interval=2
det-input-size=640
det-conf=0.25

output=true
record-fps=10
livestream=true
http-preview=0.0.0.0:8080
preview-fps=15

yaw-dry-run=true
yaw-max-angle=10
headless=true
