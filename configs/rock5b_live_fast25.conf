# CV-proj-2026 Rock5B fast recognition profile
# Goal: keep the realtime recognition loop at 25Hz+ on Rock5B CPU.
# Format: key=value. Boolean true values become flags; false values are skipped.

backend=aravis
source=Hikrobot-2bdfB0178676-DB0178676
width=1440
height=1080
fps=60
exposure-us=10000
gain-db=8
pixel-format=auto
swap-rb=true

grid-points=96
motion-thresh=2.0
downsample-width=480
downsample-height=360

denoise=off
target-luma=82
max-post-gain=2.0
gamma=1.0
clahe-clip=0

detector=yolo
model=src/yolov8n_160.onnx
detect-interval=1
det-input-size=160
det-conf=0.25

output=true
record-fps=10
livestream=true
http-preview=0.0.0.0:8080
preview-fps=10

yaw-dry-run=true
yaw-max-angle=10
headless=true
