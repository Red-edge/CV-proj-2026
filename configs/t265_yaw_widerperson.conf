# CV-proj-2026 T265 single-fisheye + real yaw motor profile.
# Uses the custom YOLOv8n WiderPerson model exported from best.pt.
# This profile is intentionally NOT dry-run: it sends real SocketCAN commands.

backend=t265
width=848
height=800
fps=30
t265-fisheye-index=2

grid-points=128
motion-thresh=2.0

denoise=gaussian
denoise-kernel=3
denoise-passes=1
target-luma=90
max-post-gain=1.8
gamma=1.0
clahe-clip=1.0

detector=yolo
model=src/widerperson_yolov8n.onnx
detect-interval=2
det-input-size=640
detect-roi-mode=full
det-conf=0.25
tracker=bytetrack
track-high-thresh=0.25
track-low-thresh=0.10
track-match-thresh=0.30
track-buffer=1
track-min-hits=2
target-filter=kalman
target-filter-process-noise=25
target-filter-measurement-noise=16
target-filter-max-predict-frames=10
target-filter-timeout-ms=350
target-filter-motion-roi-gate=1.5
target-filter-min-motion-confidence=0.15
pipeline-mode=serial
async-slot-capacity=1
async-log-queue-capacity=2
async-control-fps=30
async-target-max-age-ms=120
async-detection-max-age-ms=500
async-render-fps=15
async-drop-stale-detections=true

output=true
record-fps=15
livestream=true
http-preview=0.0.0.0:8080
preview-fps=15

yaw-enable=true
yaw-can-iface=can0
yaw-id=0x8001
yaw-feedback-zero-deg=-54.000
yaw-max-angle=45
yaw-limit-margin-deg=2.0
yaw-max-rpm=5
yaw-kp=3
yaw-ki=0.01
yaw-kd=0
yaw-deadband=0.35
yaw-control-mode=visual-servo
yaw-outer-rate-mode=fixed
yaw-outer-rate-hz=30
yaw-outer-max-stale-ms=120
yaw-outer-min-update-interval-ms=0
yaw-outer-kp=3.0
yaw-outer-ki=0.0
yaw-outer-kd=0.0
yaw-outer-ff-gain=0.0
yaw-outer-integral-limit-deg-s=30
yaw-outer-deadband-deg=0.2
yaw-inner-mode=driver-speed
yaw-inner-rate-hz=1000
yaw-inner-feedback-rate-hz=1000
yaw-inner-feedback-timeout-ms=5
yaw-inner-realtime-priority=false
yaw-inner-realtime-priority-value=60
yaw-inner-command-timeout-ms=120
yaw-inner-kp=1.0
yaw-inner-ki=0.0
yaw-inner-kd=0.0
yaw-inner-integral-limit-rpm=10
yaw-inner-output-limit-rpm=30
yaw-inner-deadband-rpm=0.1
yaw-max-accel-rpm-s=30
yaw-axis-deg-per-motor-rev=360
yaw-feedback-required=true
headless=true
